apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  REDIS_ADDR: "redis:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  MYSQL_DSN: "root:root@tcp(mysql:3306)/taskqueue?charset=utf8mb4&parseTime=True&loc=Local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: 
        app: api
        metrics: "true"
    spec:
      containers:
        - name: api
          image: task_queue-api:v9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
