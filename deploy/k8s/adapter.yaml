apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-adapter
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-adapter
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-adapter
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adapter-config
data:
  config.yaml: |
    rules: []
    externalRules:
      - seriesQuery: 'taskqueue_queue_length'
        resources:
          overrides:
            namespace: { resource: "namespace" }
        name:
          as: "taskqueue_queue_length"
        metricsQuery: 'max(<<.Series>>)'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus-adapter }
  template:
    metadata:
      labels: { app: prometheus-adapter }
    spec:
      serviceAccountName: prometheus-adapter
      containers:
        - name: adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.11.2
          imagePullPolicy: IfNotPresent
          args:
            - "--prometheus-url=http://prometheus.default.svc:9090"
            - "--config=/etc/adapter/config.yaml"
            - "--secure-port=6443"
            - "--cert-dir=/tmp/certs"
            - "--metrics-relist-interval=30s"
          ports:
            - containerPort: 6443
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: config
          configMap: { name: adapter-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
spec:
  selector: { app: prometheus-adapter }
  ports:
    - port: 443
      targetPort: 6443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  service:
    name: prometheus-adapter
    namespace: default
  group: external.metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
