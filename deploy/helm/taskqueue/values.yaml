image:
  repository: ghcr.io/qinfff/task_queue-api
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicaCount: 1
  servicePort: 8080
  metricsPort: 9090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

worker:
  replicaCount: 1
  metricsPort: 9090
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetQueueLength: 20
  scaleDownStabilizationSeconds: 30

middleware:
  mysqlImage: mysql:8.0.40
  redisImage: redis:7
  mysqlStorage: 2Gi

observability:
  prometheusImage: prom/prometheus:v2.53.0
  adapterImage: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.11.2
  grafanaImage: grafana/grafana:11.2.0
  retention: 6h

credentials:
  mysqlRootPassword: root
  grafanaAdminPassword: CHANGE_ME
