apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels:
        app: api
        metrics: "true"
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.servicePort }}
            - containerPort: {{ .Values.api.metricsPort }}
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.servicePort }}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.api.servicePort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: {{ .Values.api.servicePort }}
      targetPort: {{ .Values.api.servicePort }}
