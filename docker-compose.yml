services:
  mysql:
    image: mysql:8
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskqueue
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build: .
    ports:
      - "8080:8080"
      - "9091:9090"
    environment:
      REDIS_ADDR: "redis:6379"
      MYSQL_DSN: "root:root@tcp(mysql:3306)/taskqueue?charset=utf8mb4&parseTime=True&loc=Local"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q","-O","/dev/null","http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  worker:
    image: task_queue-api:latest
    command: [ "/app/worker" ]
    environment:
      REDIS_ADDR: "redis:6379"
      MYSQL_DSN: "root:root@tcp(mysql:3306)/taskqueue?charset=utf8mb4&parseTime=True&loc=Local"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7
    ports:
      - "6381:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  mysql-data:
