name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt 检查失败，以下文件未格式化:"
            echo "$unformatted"
            echo ""
            echo "修复命令: gofmt -w ."
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Test with race detector
        run: go test -race -v ./...

  image:
    name: Build & Push Image
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/qinfff/task_queue-api:${{ github.sha }}
            ghcr.io/qinfff/task_queue-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Local Cluster
    needs: image
    runs-on: [self-hosted, laptop]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Probe environment
        shell: powershell
        run: |
          Write-Host "helm path:"
          (Get-Command helm -ErrorAction SilentlyContinue).Source
          helm version --short
          Write-Host "kubectl path:"
          (Get-Command kubectl -ErrorAction SilentlyContinue).Source

      - name: Helm upgrade
        shell: powershell
        run: |
          helm upgrade taskqueue ./deploy/helm/taskqueue --set image.tag=${{ github.sha }} --set-string credentials.grafanaAdminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} --wait --timeout 5m
          helm status taskqueue
          helm list
